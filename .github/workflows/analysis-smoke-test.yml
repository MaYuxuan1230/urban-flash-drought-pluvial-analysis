name: analysis smoke test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Run analysis chain on synthetic inputs
        run: |
          mkdir -p results
          python 01_event_frequency_summary.py --events example_data/city_events.csv --city-panel example_data/city_year.csv --output results/city_year_event_summary.csv
          python 02_event_response_and_metrics.py --responses example_data/event_response_long.parquet --events example_data/city_events.csv --city-year example_data/city_year.csv --lag-summary results/event_lag_summary.csv --metrics results/event_response_metrics.parquet
          python 03_event_matching_and_effects.py --metrics results/event_response_metrics.parquet --output-dir results/matching --bootstrap-draws 200
          python 04_gamm_response_surfaces.py --metrics results/event_response_metrics.parquet --output-dir results/gamm --posterior-draws 500 --support-k 5
          # Ten resamples keep CI fast; the published default is 1,000.
          python 05_city_typology.py --metrics results/event_response_metrics.parquet --city-year example_data/city_year.csv --output-dir results/clustering --clusters 3 --stability-runs 10
